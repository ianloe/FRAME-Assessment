name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frame
          POSTGRES_PASSWORD: frame_test_password
          POSTGRES_DB: frame_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: Run API integration tests
        env:
          DATABASE_URL: postgresql://frame:frame_test_password@localhost:5432/frame_db
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long
        run: npm run test:api
      - name: Dependency security audit
        run: npm audit --audit-level=high
