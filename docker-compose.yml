services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frame_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-frame_db}
    volumes:
      - frame_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frame} -d ${POSTGRES_DB:-frame_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8088}
      DATABASE_URL: postgresql://${POSTGRES_USER:-frame}:${POSTGRES_PASSWORD:-frame_dev_password}@db:5432/${POSTGRES_DB:-frame_db}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret-at-least-32-chars-long}
      TOTP_ENCRYPTION_KEYS: ${TOTP_ENCRYPTION_KEYS:-v1:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TOTP_ACTIVE_KEY_VERSION: ${TOTP_ACTIVE_KEY_VERSION:-v1}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-FRAME Assessment Platform}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8088}
      ADMIN_NAME: ${ADMIN_NAME:-Platform Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@frame.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-noreply@frame.local}
      UPLOAD_DIR: /app/uploads
    volumes:
      - frame_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:8080"

volumes:
  frame_pgdata:
  frame_uploads:
